# Configuration de la base de données H2 (en mémoire)
spring.datasource.url=jdbc:h2:mem:ebank-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Activer la console H2 accessible depuis le navigateur
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Numéro du port du microservice
server.port=8081

spring.graphql.graphiql.enabled=true